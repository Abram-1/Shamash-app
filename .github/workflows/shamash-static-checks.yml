name: SHAMASH isolated static checks

on:
  push:
    branches:
      - automation/shamash-ci-setup-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shamash-synthetic-agent-pilot
  cancel-in-progress: false

jobs:
  static-contract:
    name: Read-only repository smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate versioned exchange records and hash-linked history (no AI)
        id: handoff-validation
        shell: bash
        # Owner-managed Actions variable. Required JSON keys: publication_commit_sha,
        # task_id, data_commit_sha, head. No checkout-provided fallback.
        env:
          SHAMASH_HANDOFF_REFERENCE: ${{ vars.SHAMASH_HANDOFF_REFERENCE }}
        run: node automation/exchange/exchange.cjs check | tee "$RUNNER_TEMP/shamash-handoff-validation.json"
      - name: Save synthetic handoff validation report
        if: ${{ always() && (steps.handoff-validation.outcome == 'success' || steps.handoff-validation.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: shamash-handoff-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shamash-handoff-validation.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate synthetic agent handoff contract (no agents invoked)
        shell: bash
        run: node tests/shamash-agent-exchange-check.cjs
      - name: Test local exchange replay and scope protection (no AI)
        run: node tests/shamash-github-exchange-check.cjs
      - name: Verify repository entrypoints (no build or deployment)
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const required = ['index.html', 'app.js', 'orchestrator.html', 'shamash-core.js'];
          for (const file of required) {
            if (!fs.existsSync(file)) {
              console.error('MISSING:', file);
              process.exitCode = 1;
            } else {
              console.log('FOUND:', file);
            }
          }
          if (fs.existsSync('orchestrator.html')) {
            const html = fs.readFileSync('orchestrator.html', 'utf8');
            if (!html.includes('shamash-core.js')) {
              console.error('MISSING: orchestrator.html reference to shamash-core.js');
              process.exitCode = 1;
            } else {
              console.log('FOUND: orchestrator CORE reference');
            }
          }
          console.log('Scope: structural smoke check only; no runtime, integration, safety or production readiness assertion.');
          NODE

  agent-handoff:
    name: Exact-SHA evidence and Claude handoff readiness
    needs: static-contract
    if: ${{ always() && github.ref == 'refs/heads/automation/shamash-ci-setup-01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout immutable audited candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate bridge and actual synthetic Codex output
        id: bridge-tests
        run: node tests/shamash-automation-bridge-check.cjs
      - name: Preserve exact-SHA request and explicit Claude blocker
        if: ${{ always() }}
        env:
          STATIC_OUTCOME: ${{ needs.static-contract.result }}
          BRIDGE_OUTCOME: ${{ steps.bridge-tests.outcome }}
        run: node automation/bridge.cjs ci
      - name: Save evidence for recovery and independent audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shamash-agent-handoff-${{ github.sha }}-${{ github.run_attempt }}
          path: automation/runs/
          if-no-files-found: error
          retention-days: 14
      - name: Owner summary (never a Claude PASS)
        if: ${{ always() }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'automation/runs/state.json';
          const state = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : '{"stage":"BLOCKED","reason":"receipt unavailable"}';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## SHAMASH synthetic handoff\n\nClaude: BLOCKED / NOT_REVIEWED. No merge or payment authorization.\n\n```json\n' + state + '\n```\n');
          NODE
